<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/gestion-stock-vente-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestion Stock &amp; Vente</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #chargement {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #EFF6F4;
      color: #0F7A68;
      text-align: center;
      padding: 24px;
    }
    #chargement .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(15, 122, 104, 0.2);
      border-top-color: #0F7A68;
      border-radius: 50%;
      animation: tourner 0.8s linear infinite;
    }
    #chargement.erreur {
      color: #B3261E;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
    #chargement.erreur .spinner { display: none; }
    @keyframes tourner {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="chargement">
    <div class="spinner"></div>
    <div id="chargement-texte">Chargement de l'application…</div>
  </div>
  <script>
    // Sans ce filet, une erreur pendant le démarrage du moteur Flutter (sur
    // certains navigateurs mobiles) laisse juste une page blanche, sans
    // aucun indice pour diagnostiquer à distance.
    function afficherErreurDemarrage(message) {
      var conteneur = document.getElementById('chargement');
      var texte = document.getElementById('chargement-texte');
      if (!conteneur || !texte) return;
      conteneur.classList.add('erreur');
      texte.textContent = "Le démarrage a échoué :\n" + message;
    }
    window.addEventListener('error', function (event) {
      afficherErreurDemarrage(event.message || String(event.error));
    });
    window.addEventListener('unhandledrejection', function (event) {
      afficherErreurDemarrage(String(event.reason));
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
